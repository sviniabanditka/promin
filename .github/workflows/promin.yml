name: promin

# Build the image and deploy to namespace promin (promin.club); monitoring objects
# go to namespace monitoring (kube-prometheus-stack).
on:
  push:
    branches: [main]
    paths: ['server/**', 'web/**', 'Dockerfile', 'k8s/promin.yaml', 'k8s/promin-h1.yaml', 'k8s/monitoring.yaml', 'k8s/alerting.yaml', '.github/workflows/promin.yml']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/sviniabanditka/promin

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Providers submodule (private, read-only PAT)
        run: |
          git config --global url."https://x-access-token:${{ secrets.SUBMODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive
      - uses: actions/setup-go@v5
        with: { go-version-file: server/go.mod, cache-dependency-path: server/go.sum }
      - name: Go vet + test
        working-directory: server
        run: go vet -tags providers ./... && go test -tags providers ./...
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Web typecheck + ES5 bundle check
        working-directory: web
        run: npm ci && npm run typecheck && npm run typecheck:tg && npm run build && npm run check:es5

  build-and-deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The providers submodule is a private repo: SUBMODULES_TOKEN is a
      # fine-grained PAT with read access to sviniabanditka/promin-providers
      # only — so it must not be used for the main checkout (403).
      - uses: actions/checkout@v4
      - name: Providers submodule (private, read-only PAT)
        run: |
          git config --global url."https://x-access-token:${{ secrets.SUBMODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
            GO_TAGS=providers
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Репо приватный → анонимный pull из ghcr невозможен → заливаем образ
      # в containerd ноды напрямую. Дальше — apply ТОЛЬКО k8s/promin.yaml и
      # The node's host key is pinned (secret SSH_KNOWN_HOSTS = one
      # `ssh-keyscan -t ed25519 ssh.sviniabanditka.com` line): on an ephemeral
      # runner accept-new was trust-always.
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Import image into k3s containerd
        run: |
          docker pull ${{ env.IMAGE }}:${{ github.sha }}
          docker save ${{ env.IMAGE }}:${{ github.sha }} | gzip | \
            ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
              root@ssh.sviniabanditka.com \
              'gunzip | k3s ctr images import -'
      - name: Deploy to ns promin
        run: |
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            k8s/promin.yaml k8s/promin-h1.yaml k8s/monitoring.yaml k8s/alerting.yaml root@ssh.sviniabanditka.com:/tmp/
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            root@ssh.sviniabanditka.com \
            'export KUBECONFIG=/etc/rancher/k3s/k3s.yaml && \
             kubectl apply -f /tmp/promin.yaml && \
             kubectl apply -f /tmp/promin-h1.yaml && \
             kubectl apply -f /tmp/monitoring.yaml && \
             kubectl apply -f /tmp/alerting.yaml && \
             kubectl -n promin set image deploy/promin promin=${{ env.IMAGE }}:${{ github.sha }} chown-data=${{ env.IMAGE }}:${{ github.sha }} && \
             kubectl -n promin rollout restart deploy/promin-h1 && \
             kubectl -n promin rollout status deploy/promin    --timeout=120s && \
             kubectl -n promin rollout status deploy/promin-h1 --timeout=90s'
