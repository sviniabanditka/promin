# Monitoring of Promin through the cluster's kube-prometheus-stack (ns monitoring,
# Helm release "kube-prometheus"; Grafana at grafana.sviniabanditka.com).
#
# - blackbox-exporter: the stack ships without one; probes the public URLs the
#   TVs actually use (through Cloudflare / the h1 host), not the pod directly.
# - Probe: picked up by Prometheus via label release=kube-prometheus.
# - PrometheusRule: alerts (Alertmanager has only the "null" receiver until a
#   real one is configured — see docs/deployment.md "Monitoring").
# - ConfigMap grafana_dashboard=1: auto-provisioned dashboard "Promin".
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels: { app: blackbox-exporter }
spec:
  replicas: 1
  selector: { matchLabels: { app: blackbox-exporter } }
  template:
    metadata: { labels: { app: blackbox-exporter } }
    spec:
      containers:
        - name: blackbox-exporter
          image: quay.io/prometheus/blackbox-exporter:v0.25.0
          args: ["--config.file=/etc/blackbox/blackbox.yml"]
          ports: [{ name: http, containerPort: 9115 }]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts: [{ name: config, mountPath: /etc/blackbox }]
      volumes:
        - name: config
          configMap: { name: blackbox-exporter }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter
  namespace: monitoring
data:
  blackbox.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 10s
        http:
          preferred_ip_protocol: ip4
          valid_status_codes: [200]
          follow_redirects: true
      # Old-Samsung path must stay HTTP/1.1-only: fail the probe if h2 is negotiated.
      http_2xx_h1:
        prober: http
        timeout: 10s
        http:
          preferred_ip_protocol: ip4
          valid_status_codes: [200]
          valid_http_versions: ["HTTP/1.1"]
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels: { app: blackbox-exporter }
spec:
  selector: { app: blackbox-exporter }
  ports: [{ name: http, port: 9115, targetPort: http }]
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: promin-public
  namespace: monitoring
  labels: { release: kube-prometheus }
spec:
  jobName: promin-public
  interval: 60s
  module: http_2xx
  prober: { url: blackbox-exporter.monitoring.svc:9115 }
  targets:
    staticConfig:
      static:
        - https://promin.club/healthz
        - https://promin.club/api/v1/ping
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: promin-h1
  namespace: monitoring
  labels: { release: kube-prometheus }
spec:
  jobName: promin-h1
  interval: 60s
  module: http_2xx_h1
  prober: { url: blackbox-exporter.monitoring.svc:9115 }
  targets:
    staticConfig:
      static:
        - https://h1.promin.club/healthz
---
# Application metrics (promin_*) from the binary's own :9100 listener
# (PROMIN_METRICS_ADDR); the Service port is named `metrics` in k8s/promin.yaml.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: promin
  namespace: monitoring
  labels: { release: kube-prometheus }
spec:
  namespaceSelector: { matchNames: [promin] }
  selector: { matchLabels: { app: promin } }
  endpoints:
    - port: metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: promin
  namespace: monitoring
  labels: { release: kube-prometheus }
spec:
  groups:
    - name: promin
      rules:
        - alert: ProminDown
          expr: probe_success{job=~"promin-public|promin-h1"} == 0
          for: 3m
          labels: { severity: critical }
          annotations:
            summary: "Promin unreachable: {{ $labels.instance }}"
            description: "Blackbox probe has failed for 3 minutes."
        - alert: ProminSlow
          expr: probe_duration_seconds{job="promin-public"} > 3
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Promin responds slowly: {{ $labels.instance }}"
        - alert: ProminPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="promin", container="promin"}[30m]) > 2
          labels: { severity: warning }
          annotations:
            summary: "promin pod restarted more than twice in 30 minutes"
        - alert: ProminMemoryHigh
          expr: container_memory_working_set_bytes{namespace="promin", container="promin"} > 1.7e9
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "promin container near its 2Gi memory limit"
        - alert: ProminDataDiskFilling
          expr: kubelet_volume_stats_available_bytes{namespace="promin", persistentvolumeclaim="promin-data"} / kubelet_volume_stats_capacity_bytes{namespace="promin", persistentvolumeclaim="promin-data"} < 0.1
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "promin data volume under 10% free"
        # A source whose resolves mostly come back empty/failed for 6 h is
        # broken (markup changed, host blocked) — catch it before the TV shows
        # an empty list. ≥ 5 attempts so one unlucky title doesn't page.
        - alert: ProminSourceFailing
          expr: |
            (
              sum by (provider) (increase(promin_source_resolve_total{outcome!="ok"}[6h]))
                / sum by (provider) (increase(promin_source_resolve_total[6h]))
            ) > 0.8
            and sum by (provider) (increase(promin_source_resolve_total[6h])) >= 5
          labels: { severity: warning }
          annotations:
            summary: "source {{ $labels.provider }} failing: {{ $value | humanizePercentage }} of resolves empty/error over 6h"
        - alert: ProminHttp5xx
          expr: |
            sum(rate(promin_http_requests_total{status=~"5.."}[15m]))
              / sum(rate(promin_http_requests_total[15m])) > 0.05
          labels: { severity: warning }
          annotations:
            summary: "promin 5xx ratio {{ $value | humanizePercentage }} over 15m"
        - alert: ProminRelayUpstreamErrors
          expr: increase(promin_relay_upstream_errors_total[15m]) > 30
          labels: { severity: warning }
          annotations:
            summary: "/relay: {{ $value | humanize }} upstream failures in 15m"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-promin
  namespace: monitoring
  labels: { grafana_dashboard: "1" }
data:
  promin.json: |
    {
      "uid": "promin",
      "title": "Promin",
      "tags": ["promin"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "1m",
      "time": { "from": "now-24h", "to": "now" },
      "panels": [
        { "id": 1, "type": "stat", "title": "Availability (24h)", "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1,
            "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "orange", "value": 0.99 }, { "color": "green", "value": 0.999 } ] } } },
          "targets": [ { "expr": "avg_over_time(probe_success{job=\"promin-public\", instance=\"https://promin.club/healthz\"}[24h])", "legendFormat": "promin.club" } ] },
        { "id": 2, "type": "stat", "title": "Up now", "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "fieldConfig": { "defaults": { "mappings": [ { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } } ], "color": { "mode": "thresholds" } } },
          "options": { "colorMode": "background", "textMode": "value_and_name" },
          "targets": [ { "expr": "probe_success{job=~\"promin-public|promin-h1\"}", "legendFormat": "{{instance}}" } ] },
        { "id": 3, "type": "stat", "title": "Deployed version", "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 },
          "options": { "textMode": "name", "colorMode": "none" },
          "targets": [ { "expr": "kube_pod_container_info{namespace=\"promin\", container=\"promin\"}", "legendFormat": "{{image}}" } ] },
        { "id": 4, "type": "stat", "title": "Restarts (24h)", "gridPos": { "x": 18, "y": 0, "w": 6, "h": 4 },
          "targets": [ { "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"promin\", container=\"promin\"}[24h]))" } ] },
        { "id": 5, "type": "timeseries", "title": "Probe duration", "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [ { "expr": "probe_duration_seconds{job=~\"promin-public|promin-h1\"}", "legendFormat": "{{instance}}" } ] },
        { "id": 6, "type": "timeseries", "title": "Memory (working set)", "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            { "expr": "container_memory_working_set_bytes{namespace=\"promin\", container=\"promin\"}", "legendFormat": "used" },
            { "expr": "kube_pod_container_resource_limits{namespace=\"promin\", container=\"promin\", resource=\"memory\"}", "legendFormat": "limit" } ] },
        { "id": 7, "type": "timeseries", "title": "CPU (cores)", "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "targets": [ { "expr": "rate(container_cpu_usage_seconds_total{namespace=\"promin\", container=\"promin\"}[5m])", "legendFormat": "cpu" } ] },
        { "id": 8, "type": "timeseries", "title": "Data volume used", "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            { "expr": "kubelet_volume_stats_used_bytes{namespace=\"promin\", persistentvolumeclaim=\"promin-data\"}", "legendFormat": "used" },
            { "expr": "kubelet_volume_stats_capacity_bytes{namespace=\"promin\", persistentvolumeclaim=\"promin-data\"}", "legendFormat": "capacity" } ] },
        { "id": 9, "type": "timeseries", "title": "Network (pod)", "gridPos": { "x": 0, "y": 20, "w": 24, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "Bps" } },
          "targets": [
            { "expr": "sum(rate(container_network_transmit_bytes_total{namespace=\"promin\"}[5m]))", "legendFormat": "tx" },
            { "expr": "sum(rate(container_network_receive_bytes_total{namespace=\"promin\"}[5m]))", "legendFormat": "rx" } ] },
        { "id": 10, "type": "row", "title": "Application (promin_*)", "collapsed": false, "gridPos": { "x": 0, "y": 28, "w": 24, "h": 1 } },
        { "id": 11, "type": "timeseries", "title": "Requests/s by status", "gridPos": { "x": 0, "y": 29, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "stacking": { "mode": "normal" } } } },
          "targets": [ { "expr": "sum by (status) (rate(promin_http_requests_total[5m]))", "legendFormat": "{{status}}" } ] },
        { "id": 12, "type": "timeseries", "title": "p95 latency by route (top 10)", "gridPos": { "x": 12, "y": 29, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [ { "expr": "topk(10, histogram_quantile(0.95, sum by (le, route) (rate(promin_http_request_duration_seconds_bucket[5m]))))", "legendFormat": "{{route}}" } ] },
        { "id": 13, "type": "bargauge", "title": "Source resolve success (6h)", "gridPos": { "x": 0, "y": 37, "w": 8, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1,
            "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "orange", "value": 0.2 }, { "color": "green", "value": 0.5 } ] } } },
          "options": { "orientation": "horizontal", "displayMode": "gradient" },
          "targets": [ { "expr": "sum by (provider) (increase(promin_source_resolve_total{outcome=\"ok\"}[6h])) / sum by (provider) (increase(promin_source_resolve_total[6h]))", "legendFormat": "{{provider}}", "instant": true } ] },
        { "id": 14, "type": "timeseries", "title": "Source resolve p95 by provider", "gridPos": { "x": 8, "y": 37, "w": 8, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [ { "expr": "histogram_quantile(0.95, sum by (le, provider) (rate(promin_source_resolve_duration_seconds_bucket[15m])))", "legendFormat": "{{provider}}" } ] },
        { "id": 15, "type": "timeseries", "title": "Active: remux jobs / torrents / WS clients", "gridPos": { "x": 16, "y": 37, "w": 8, "h": 8 },
          "targets": [
            { "expr": "promin_remux_jobs_active", "legendFormat": "remux jobs" },
            { "expr": "promin_torrents_active", "legendFormat": "torrents" },
            { "expr": "promin_ws_clients", "legendFormat": "ws clients" },
            { "expr": "promin_player_devices_playing", "legendFormat": "playing" } ] },
        { "id": 16, "type": "timeseries", "title": "Relay: upstream errors (5m) / requests by kind", "gridPos": { "x": 0, "y": 45, "w": 12, "h": 8 },
          "targets": [
            { "expr": "increase(promin_relay_upstream_errors_total[5m])", "legendFormat": "upstream errors" },
            { "expr": "sum by (kind) (rate(promin_relay_requests_total[5m]))", "legendFormat": "{{kind}}/s" } ] },
        { "id": 17, "type": "timeseries", "title": "Source searches + torrent searches (outcome/s)", "gridPos": { "x": 12, "y": 45, "w": 12, "h": 8 },
          "targets": [
            { "expr": "sum by (provider, outcome) (rate(promin_source_search_total[15m]))", "legendFormat": "{{provider}} {{outcome}}" },
            { "expr": "sum by (outcome) (rate(promin_torrent_search_total[15m]))", "legendFormat": "jacred {{outcome}}" } ] },
        { "id": 18, "type": "row", "title": "Residential proxy (promin_proxy_*)", "collapsed": false, "gridPos": { "x": 0, "y": 53, "w": 24, "h": 1 } },
        { "id": 19, "type": "stat", "title": "Proxy up now", "gridPos": { "x": 0, "y": 54, "w": 6, "h": 4 },
          "fieldConfig": { "defaults": { "mappings": [ { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } } ], "color": { "mode": "thresholds" } } },
          "options": { "colorMode": "background", "textMode": "value" },
          "targets": [ { "expr": "promin_proxy_up" } ] },
        { "id": 20, "type": "stat", "title": "Traffic left", "gridPos": { "x": 6, "y": 54, "w": 6, "h": 4 },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100,
            "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "orange", "value": 10 }, { "color": "green", "value": 25 } ] } } },
          "options": { "colorMode": "background", "textMode": "value_and_name" },
          "targets": [ { "expr": "100 * sum by (package) (promin_proxy_quota_bytes{kind=\"remaining\"}) / sum by (package) (promin_proxy_quota_bytes{kind=\"limit\"})", "legendFormat": "#{{package}}" } ] },
        { "id": 21, "type": "stat", "title": "Package expires in", "gridPos": { "x": 12, "y": 54, "w": 6, "h": 4 },
          "fieldConfig": { "defaults": { "unit": "d", "decimals": 1,
            "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "orange", "value": 3 }, { "color": "green", "value": 7 } ] } } },
          "options": { "colorMode": "background", "textMode": "value_and_name" },
          "targets": [ { "expr": "(promin_proxy_expires_timestamp_seconds - time()) / 86400", "legendFormat": "#{{package}}" } ] },
        { "id": 22, "type": "stat", "title": "Last probe", "gridPos": { "x": 18, "y": 54, "w": 6, "h": 4 },
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 2 } },
          "targets": [ { "expr": "promin_proxy_probe_duration_seconds" } ] },
        { "id": 23, "type": "timeseries", "title": "Proxy latency / availability", "gridPos": { "x": 0, "y": 58, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            { "expr": "promin_proxy_probe_duration_seconds", "legendFormat": "probe duration" },
            { "expr": "promin_proxy_up", "legendFormat": "up" } ] },
        { "id": 24, "type": "timeseries", "title": "Proxy traffic used / remaining", "gridPos": { "x": 12, "y": 58, "w": 12, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            { "expr": "promin_proxy_quota_bytes{kind=\"used\"}", "legendFormat": "#{{package}} used" },
            { "expr": "promin_proxy_quota_bytes{kind=\"remaining\"}", "legendFormat": "#{{package}} remaining" } ] }
      ]
    }
