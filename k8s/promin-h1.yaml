# HTTP/1.1-only TLS front for promin, on port 8444.
# Old Samsung Tizen (pre-2022) Chromium chokes on HTTP/2 for sustained media
# → "Ошибка сети" (PIPELINE_ERROR_NETWORK) even via hls.js. Traefik always offers
# h2 via ALPN, so: nginx with http2 OFF on :8444, proxying to promin.
#
# On the old Samsung only, point MSX at https://promin.sviniabanditka.com:8444 —
# promin's /msx/start.json is generated from the request Host, so it returns the
# :8444 links, and every request (UI + API + /relay + /remux stream) then flows
# over HTTP/1.1. Modern TVs keep :443 (h2). :8443 is taken by lampac-h1, so :8444.
apiVersion: v1
kind: ConfigMap
metadata:
  name: promin-h1-nginx
  namespace: promin
data:
  nginx.conf: |
    worker_processes auto;
    events { worker_connections 2048; }
    http {
      access_log off;
      map $http_upgrade $connection_upgrade { default upgrade; '' close; }
      server {
        listen 8444 ssl;                 # deliberately NO http2
        server_name promin.sviniabanditka.com;
        ssl_certificate     /certs/tls.crt;
        ssl_certificate_key /certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # MSX addresses the port over plain HTTP by default; without this the
        # TLS listener answers "400 plain HTTP to HTTPS port". Redirect to
        # https on the same :8444 (like Traefik's :80->:443 on the main host).
        error_page 497 =301 https://promin.sviniabanditka.com:8444$request_uri;

        client_max_body_size 0;
        location / {
          proxy_pass http://promin.promin.svc.cluster.local:8080;
          proxy_http_version 1.1;
          proxy_set_header Host $http_host;          # keep :8444 so start.json/links stay :8444
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $remote_addr;
          proxy_set_header X-Real-IP $remote_addr;
          # WebSocket upgrade for /nws (rch) and /api/v1/ws (sync push)
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_buffering off;                        # stream, don't buffer
          proxy_request_buffering off;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: promin-h1
  namespace: promin
spec:
  replicas: 1
  selector: { matchLabels: { app: promin-h1 } }
  template:
    metadata: { labels: { app: promin-h1 } }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 8444 }]
          volumeMounts:
            - { name: conf,  mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf }
            - { name: certs, mountPath: /certs, readOnly: true }
          resources:
            requests: { cpu: "50m", memory: "32Mi" }
            limits:   { memory: "256Mi" }
      volumes:
        - { name: conf,  configMap: { name: promin-h1-nginx } }
        - name: certs
          secret: { secretName: promin-tls }   # cert-manager cert for promin.sviniabanditka.com
---
# LoadBalancer so k3s ServiceLB binds node :8444 directly (bypasses Traefik/h2).
apiVersion: v1
kind: Service
metadata:
  name: promin-h1
  namespace: promin
spec:
  type: LoadBalancer
  selector: { app: promin-h1 }
  ports:
    - { name: https-h1, port: 8444, targetPort: 8444 }
